<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="icon" type="image/x-icon" href="https://thatopen.github.io/engine_components/resources/favicon.ico">
    <title>BIM</title>
    <th:block th:if="${_csrf}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <meta name="_csrf" th:content="${_csrf.token}">
    </th:block>
  <script type="module" crossorigin src="/my_bim_app_public/assets/index.js"></script>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        overflow: hidden;
    }

    .left-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 200px;
        background: #1e1e1e;
        color: white;
        padding: 1rem;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 10;
        transition: transform 0.3s ease-in-out;
    }

    #container {
        position: absolute;
        top: 0;
        left: 300px;
        right: 300px;
        width: calc(100vw - 600px);
        height: 100vh;
        background: #222;
        transition: all 0.3s ease-in-out;
    }

    #container.full {
        left: 0;
        right: 0;
        width: 100vw;
    }

    .right-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: 300px;
        height: 100vh;
        background: #1e1e1e;
        color: white;
        padding: 1rem;
        box-sizing: border-box;
        overflow-y: auto;
        z-index: 10;
        transition: transform 0.3s ease-in-out;
    }

    .options-menu {
        position: absolute;
        min-width: unset;
        top: 5px;
        right: 5px;
        max-height: calc(100vh - 10px);
    }

    .options-menu1 {
        position: absolute;
        min-width: unset;
        top: 5px;
        left: 50px;
        max-height: calc(100vh - 10px);
    }

    .phone-menu-toggler {
        visibility: hidden;
    }
    .phone-menu-toggler1 {
        visibility: hidden;
    }

    @media (max-width: 480px) {
        .options-menu {
            visibility: hidden;
            bottom: 5px;
            left: 5px;
        }
        .options-menu1 {
            visibility: hidden;
            bottom: 5px;
            left: 5px;
        }

        .options-menu-visible {
            visibility: visible;
        }

        .phone-menu-toggler {
            visibility: visible;
            position: fixed;
            top: 5px;
            right: 5px;
        }

        .phone-menu-toggler1 {
            visibility: visible;
            position: fixed;
            top: 5px;
            right: 40px;
        }
    }
    #object-explorer {
        position: absolute;
        top: 0;
        height: 100%;
        width: 300px;
        background:
            radial-gradient(circle at 15% 0%, rgba(45, 212, 191, 0.16), transparent 34%),
            linear-gradient(180deg, #0b1220 0%, #111827 48%, #0f172a 100%);
        box-shadow: 12px 0 36px rgba(2, 6, 23, 0.35);
        border-right: 1px solid rgba(148, 163, 184, 0.16);
        overflow: hidden;
        transition: transform 0.3s ease-in-out;
        z-index: 100;
    }

    .object-explorer-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.8rem;
        box-sizing: border-box;
        color: #e5edf7;
        font-family: "Plus Jakarta Sans", sans-serif;
    }

    .object-explorer-hero {
        position: relative;
        padding: 0.95rem 2.9rem 1rem 0.95rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.15rem;
        background:
            linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(15, 118, 110, 0.24)),
            radial-gradient(circle at 100% 0%, rgba(56, 189, 248, 0.18), transparent 38%);
        box-shadow: 0 18px 36px rgba(2, 6, 23, 0.28);
    }

    .object-explorer-eyebrow {
        color: #67e8f9;
        font-size: 0.67rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .object-explorer-title {
        margin-top: 0.25rem;
        color: #f8fafc;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.035em;
    }

    .object-explorer-subtitle {
        margin-top: 0.35rem;
        color: rgba(203, 213, 225, 0.72);
        font-size: 0.72rem;
        line-height: 1.4;
    }

    .object-explorer-toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
    }

    .object-explorer-action {
        min-width: 0;
        border-radius: 0.8rem;
        font-weight: 800;
        border: 1px solid rgba(94, 234, 212, 0.44);
        box-shadow: 0 8px 18px rgba(2, 6, 23, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        --bim-button--bgc: rgba(20, 184, 166, 0.58);
        --bim-label--c: #ecfeff;
        --bim-icon--c: #ecfeff;
        --bim-ui_main-base: #2dd4bf;
        --bim-ui_main-contrast: #042f2e;
    }

    .object-explorer-action:hover {
        border-color: rgba(125, 249, 235, 0.82);
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.16), 0 10px 22px rgba(2, 6, 23, 0.32);
    }

    .object-explorer-search-wrap {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.7rem;
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.68);
    }

    .object-explorer-search-wrap span {
        color: rgba(203, 213, 225, 0.72);
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
    }

    .object-explorer-search {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.20);
        border-radius: 0.75rem;
        outline: none;
        padding: 0.55rem 0.65rem;
        box-sizing: border-box;
        background: rgba(2, 6, 23, 0.48);
        color: #f8fafc;
        font: inherit;
        font-size: 0.78rem;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .object-explorer-search::placeholder {
        color: rgba(148, 163, 184, 0.62);
    }

    .object-explorer-search:focus {
        border-color: rgba(45, 212, 191, 0.72);
        background: rgba(2, 6, 23, 0.72);
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.13);
    }

    .object-explorer-tree-card {
        flex: 1 1 auto;
        min-height: 0;
        padding: 0.45rem;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 1.15rem;
        background:
            linear-gradient(180deg, rgba(15, 23, 42, 0.82), rgba(2, 6, 23, 0.76)),
            radial-gradient(circle at 15% 10%, rgba(45, 212, 191, 0.08), transparent 30%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        overflow: hidden;
    }

    .object-explorer-tree-card bim-table {
        height: 100%;
    }

    .close-btn.object-explorer-close {
        top: 0.65rem;
        right: 0.65rem;
        width: 2.1rem;
        height: 2.1rem;
        border-radius: 0.75rem;
        background: rgba(248, 250, 252, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.62);
        box-shadow: 0 10px 24px rgba(2, 6, 23, 0.32);
        --bim-label--c: #0f172a;
        --bim-icon--c: #0f172a;
        --bim-ui_main-base: #2dd4bf;
        --bim-ui_main-contrast: #042f2e;
    }

    .close-btn.object-explorer-close:hover {
        background: #2dd4bf;
        border-color: rgba(153, 246, 228, 0.96);
        box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.20), 0 12px 26px rgba(2, 6, 23, 0.36);
    }

    #object-property {
        position: absolute;
        top: 0;
        height: 100%;
        width: 300px;
        background: #1e1e1e;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        transition: transform 0.3s ease-in-out;
        z-index: 100;
    }

    #object-explorer {
        left: 0;
        transform: translateX(0);
    }

    #object-explorer.collapsed {
        transform: translateX(-100%);
    }

    #object-property {
        right: 0;
        transform: translateX(0);
    }

    #object-property.collapsed {
        transform: translateX(100%);
    }
    .close-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        background: #f5f5f5;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
    }
    .close-btn-right {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 1.8rem;
        height: 1.8rem;
        border-radius: 50%;
        background: #f5f5f5;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.2);
    }

    .close-btn:hover,
    .close-btn-right:hover {
        background: #6a0dad;
        border-color: #6a0dad;
        color: white;
        box-shadow: 0 0 8px rgba(106, 13, 173, 0.5);
        transition: all 0.2s ease-in-out;
    }
    .reopen-btn {
        position: absolute;
        top: 12px;
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background:
            linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 118, 110, 0.72)),
            radial-gradient(circle at 20% 0%, rgba(45, 212, 191, 0.25), transparent 42%);
        color: #ecfeff;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 14px 32px rgba(2, 6, 23, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        transition: opacity 0.2s, transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        z-index: 200;
    }

    .reopen-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.16), 0 16px 34px rgba(2, 6, 23, 0.42);
    }

    .reopen-btn-icon {
        width: 1.05rem;
        height: 0.82rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }

    .reopen-btn-icon span {
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: #99f6e4;
        box-shadow: 0 0 8px rgba(153, 246, 228, 0.36);
    }

    .reopen-btn-text {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 1.25rem;
        line-height: 1;
        white-space: nowrap;
        flex: 0 0 auto;
        transform: translateY(-0.5px);
    }

    .reopen-btn.right {
        right: 10px;
    }

    .reopen-btn.left {
        left: 12px;
    }

    #object-explorer:not(.collapsed)~.reopen-btn.left {
        opacity: 0;
        pointer-events: none;
    }

    #object-property:not(.collapsed)~.reopen-btn.right {
        opacity: 0;
        pointer-events: none;
    }

    #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 1.2rem;
        z-index: 100;
    }

    .memory-box {
        position: fixed;
        left: 50%;
        top: 0.7rem;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 2rem;
        padding: 0.35rem 0.72rem;
        box-sizing: border-box;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 999px;
        background:
            radial-gradient(circle at 10% 0%, rgba(45, 212, 191, 0.18), transparent 40%),
            linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(2, 6, 23, 0.82));
        color: #e5edf7;
        box-shadow: 0 14px 32px rgba(2, 6, 23, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(12px);
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        z-index: 9999;
    }

    .memory-box-label {
        color: rgba(203, 213, 225, 0.72);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.11em;
    }

    .memory-box-value {
        min-width: 4.8rem;
        color: #ecfeff;
        font-size: 0.78rem;
        font-weight: 900;
        text-align: right;
        font-variant-numeric: tabular-nums;
    }

    .memory-box[data-level="medium"] .memory-box-value {
        color: #fef3c7;
    }

    .memory-box[data-level="high"] .memory-box-value {
        color: #ffe4e6;
    }

    #toggle-button {
        position: absolute;
        top: 5px;
        right: 6px;
        z-index: 1000;
        padding: 6px 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
        background: #fff;
        transition: background 0.2s, transform 0.1s;
    }

    #toggle-button:hover {
        background: #6a0dad;
        border-color: #6a0dad;
        color: white;
        box-shadow: 0 0 8px rgba(106, 13, 173, 0.5);
        transition: all 0.2s ease-in-out;
    }

    #toggle-button:active {
        transform: scale(0.97);
    }

    #panel-container {
        position: absolute;
        top: 10px;
        right: 0;
        z-index: 999;
    }

    #toggle-button1 {
        position: absolute;
        top: 5px;
        right: 240px;
        z-index: 1000;
        padding: 6px 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        cursor: pointer;
        background: #fff;
        transition: background 0.2s, transform 0.1s;
    }

    #toggle-button1:hover {
        background: #6a0dad;
        border-color: #6a0dad;
        color: white;
        box-shadow: 0 0 8px rgba(106, 13, 173, 0.5);
        transition: all 0.2s ease-in-out;
    }

    #toggle-button1:active {
        transform: scale(0.97);
    }

    #panel-container1 {
        position: absolute;
        top: 10px;
        right: 250px;
        z-index: 999;
    }

    .direction-buttons {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin: 0.5rem 0;
    }
    .direction-buttons bim-button {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        text-align: center;
        font-weight: 500;
        border-radius: 0.5rem;
        transition: background 0.2s, color 0.2s;
    }
    .direction-buttons bim-button.active {
        background: #007bff;
        color: white;
        border-color: #007bff;
    }

    .bottom-row {
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        gap: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
        width: 100%;
        box-sizing: border-box;
    }

    .bottom-row bim-dropdown {
        flex: 1 1 12rem;
        min-width: 12rem;
        max-width: 20rem;
    }

    .bottom-row bim-dropdown::part(select) {
        width: 100%;
    }

    .coordinate-inputs {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-width: 4rem;
        flex-shrink: 0;
        width: 6rem;
    }

    .coordinate-inputs label {
        font-weight: 500;
        font-size: 0.9rem;
        white-space: nowrap;
    }
    .editor-slider {
        width: 100%;
        margin: 10px 0;
        font-family: sans-serif;
    }

    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .top-row label {
        font-size: 14px;
        font-weight: 600;
    }

    .value-box {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .value-box input[type="number"] {
        width: 70px;
        padding: 4px 6px;
        border: 1px solid #4e91ddff;
        border-radius: 6px;
        font-size: 14px;
    }

    .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .slider-row .min-label,
    .slider-row .max-label {
        font-size: 12px;
        width: 30px;
        text-align: center;
    }

    .slider-row input[type="range"] {
        flex-grow: 1;
        height: 6px;
        background: #ddd;
        border-radius: 4px;
        -webkit-appearance: none;
    }

    .slider-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #3e92e0ff;
        border-radius: 50%;
        cursor: pointer;
    }

    .current-value {
        text-align: center;
        font-size: 13px;
        margin-top: 4px;
        color: #555;
    }

    .common-tools-panel {
        width: 24rem;
        min-width: 24rem;
        max-width: 24rem;
        max-height: calc(100vh - 10px);
        overflow: hidden;
        overflow-x: hidden;
        box-sizing: border-box;
        color: #e5edf7;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.15rem;
        background:
            radial-gradient(circle at 12% 0%, rgba(45, 212, 191, 0.15), transparent 34%),
            radial-gradient(circle at 100% 18%, rgba(14, 165, 233, 0.12), transparent 30%),
            linear-gradient(180deg, rgba(15, 23, 42, 0.97), rgba(2, 6, 23, 0.94));
        box-shadow: 0 18px 36px rgba(2, 6, 23, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        --bim-ui_bg-base: transparent;
        --bim-ui_bg-contrast-20: rgba(148, 163, 184, 0.16);
        --bim-ui_bg-contrast-80: #e5edf7;
        --bim-ui_accent-base: #99f6e4;
        --bim-panel--c: #f8fafc;
        --bim-panel-section_hc: #f8fafc;
        --bim-label--c: #e5edf7;
    }

    .common-tools-section {
        max-width: 100%;
        overflow-x: hidden;
        color: #e5edf7;
        --bim-ui_accent-base: #99f6e4;
        --bim-panel-section_hc: #f8fafc;
        --bim-ui_bg-contrast-80: #e5edf7;
    }

    .common-tools-section:hover,
    .common-tools-subsection:hover {
        --bim-ui_accent-base: #67e8f9;
    }

    .common-tools-shell {
        width: 100%;
        max-width: 22rem;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
    }

    .common-tool-card {
        width: 100%;
        min-width: 0;
        padding: 0.78rem;
        box-sizing: border-box;
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.16);
        background:
            radial-gradient(circle at 100% 0%, rgba(45, 212, 191, 0.10), transparent 42%),
            linear-gradient(180deg, rgba(30, 41, 59, 0.82), rgba(15, 23, 42, 0.74));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .common-tool-card-primary {
        border-color: rgba(94, 234, 212, 0.24);
        background:
            linear-gradient(135deg, rgba(20, 184, 166, 0.22), rgba(14, 165, 233, 0.12)),
            linear-gradient(180deg, rgba(15, 23, 42, 0.86), rgba(2, 6, 23, 0.72));
    }

    .common-tool-card-plain {
        padding: 0;
        overflow: hidden;
    }

    .common-tool-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.7rem;
    }

    .common-tool-heading span {
        color: #f8fafc;
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
    }

    .common-tool-heading small {
        color: rgba(203, 213, 225, 0.64);
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .common-tools-button-grid,
    .saved-view-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        min-width: 0;
    }

    .common-tools-button-grid bim-button,
    .saved-view-actions bim-button,
    .saved-view-name-button {
        min-width: 0;
        height: 2rem;
        border-radius: 0.72rem;
        font-weight: 800;
        border: 1px solid rgba(94, 234, 212, 0.28);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 18px rgba(2, 6, 23, 0.20);
        --bim-button--bgc: rgba(15, 118, 110, 0.34);
        --bim-label--c: #ecfeff;
        --bim-icon--c: #ecfeff;
        --bim-ui_main-base: #2dd4bf;
        --bim-ui_main-contrast: #042f2e;
    }

    .common-tools-button-grid bim-button:hover,
    .saved-view-actions bim-button:hover,
    .saved-view-name-button:hover {
        border-color: rgba(204, 251, 241, 0.96);
        box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.18), 0 10px 22px rgba(2, 6, 23, 0.28);
        --bim-button--bgc: #99f6e4;
        --bim-label--c: #042f2e;
        --bim-icon--c: #042f2e;
    }

    .common-tools-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
        align-items: center;
        min-width: 0;
    }

    .common-tools-row bim-checkbox,
